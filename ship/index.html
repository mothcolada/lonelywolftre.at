    <body>
        <div class="stars"></div>
        <div class="twinkling"></div>
        <div id="content">
            <img src="../assets/faces/face13-6.png" alt="Thyme" id="top-character" />
            <p id="message">Click the button below to find a new universe's ship...</p>
            <div class="action-buttons"><div class="gen-button" id="two-char-button">🔘</div></div>
            <p class="sub-message" id="love-message" style="opacity: 1; transition: opacity 1s">
                I can't limit my love to just one!
            </p>
            <div class="action-buttons" id="heart-container" style="opacity: 1; transition: opacity 1s">
                <div class="gen-button heart-button" id="three-char-button">❤️</div>
            </div>
        </div>
        <div id="results" style="display: none">
            <p id="ship-message">You have found the following universe's ship...</p>
            <div class="characters-display">
                <img id="left-character" src="" alt="Left Character" />
                <img id="center-character" src="" alt="Center Character" style="display: none" />
                <img id="right-character" src="" alt="Right Character" />
            </div>
            <p id="ship-names"></p>
            <p id="combined-ship-name"></p>
            <div id="reroll-section" style="display: none">
                <div class="two-column-grid">
                    <p id="reroll-prompt">Find a new universe...?</p>
                    <p id="return-prompt">Return back...?</p>
                    <div class="action-buttons"><div class="gen-button" id="reroll-button"></div></div>
                    <div class="action-buttons"><div class="gen-button" id="back-button">🔙</div></div>
                </div>
            </div>
        </div>
        <div class="bottom-left-buttons">
            <a href="https://lonelywolftreat.com/links/" target="_blank">
                <img src="home.svg" alt="Home" class="corner-button" />
            </a>
        </div>
        <div class="bottom-right-buttons">
            <label for="extras-checkbox" style="cursor: pointer">
                <input type="checkbox" id="extras-checkbox" class="extras-checkbox" />
            </label>
           <a
                href="https://lonelywolftreat.com/ship/extras.html"
                class="extras-label"
                style="text-decoration: none; color: inherit; font-size: inherit">
                Extras?
            </a>
        </div>
